<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - HRMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-4px);
        }
        .login-card .brand-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .login-card .brand-icon i {
            font-size: 3.5rem;
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            padding: 20px;
            border-radius: 50%;
        }
        .login-card h3 {
            font-weight: 700;
            color: #1a1a2e;
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }
        .login-card .subtitle {
            color: #6c757d;
            text-align: center;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }
        .login-card .form-label {
            font-weight: 500;
            color: #1a1a2e;
            font-size: 0.9rem;
        }
        .login-card .input-group-text {
            background: transparent;
            border-right: none;
            border-color: #e9ecef;
            color: #6c757d;
        }
        .login-card .form-control {
            border-left: none;
            border-color: #e9ecef;
            padding: 12px 16px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .login-card .form-control:focus {
            border-color: #667eea;
            box-shadow: none;
        }
        .login-card .form-control:focus + .input-group-text,
        .login-card .input-group:focus-within .input-group-text {
            border-color: #667eea;
        }
        .login-card .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        .login-card .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .login-card .btn-login:active {
            transform: scale(0.98);
        }
        .login-card .demo-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: #6c757d;
            border-top: 1px solid #e9ecef;
            padding-top: 20px;
        }
        .login-card .demo-note i {
            color: #667eea;
        }
        .alert {
            border-radius: 12px;
            border: none;
            padding: 12px 16px;
            font-size: 0.9rem;
        }
        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
        }
        .alert-success {
            background: #d1fae5;
            color: #065f46;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 20px;
            }
            .login-card h3 {
                font-size: 1.5rem;
            }
            .login-card .brand-icon i {
                font-size: 2.8rem;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-icon">
                <i class="fas fa-building"></i>
            </div>
            <h3>Welcome Back</h3>
            <p class="subtitle">Sign in to your HRMS account</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        <i class="fas fa-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}times-circle{% else %}info-circle{% endif %} me-2"></i>
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="fas fa-user me-1 text-primary"></i> Username
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock me-1 text-primary"></i> Password
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i> Sign In
                </button>
            </form>

            <div class="demo-note">
                <i class="fas fa-shield-alt me-1"></i> Demo: <strong>admin</strong> / <strong>admin123</strong>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
