{% extends 'base.html' %}

{% block title %}Login - HRMS{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8 space-y-6">
        <div class="text-center">
            <i class="fas fa-building text-5xl text-purple-500"></i>
            <h3 class="mt-2 text-3xl font-bold text-gray-800">Welcome Back</h3>
            <p class="text-gray-500">Sign in to your HRMS account</p>
        </div>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <input type="text" name="username" id="username" class="focus:ring-purple-500 focus:border-purple-500 block w-full pl-10 pr-3 py-2 border-2 border-gray-300 rounded-lg" placeholder="Enter your username" required autofocus>
                </div>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" name="password" id="password" class="focus:ring-purple-500 focus:border-purple-500 block w-full pl-10 pr-3 py-2 border-2 border-gray-300 rounded-lg" placeholder="Enter your password" required>
                </div>
            </div>
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                <i class="fas fa-sign-in-alt mr-2"></i> Sign In
            </button>
        </form>
        <div class="text-center text-sm text-gray-500">
            <i class="fas fa-shield-alt mr-1"></i> Demo: admin / admin123
        </div>
    </div>
</div>
{% endblock %}
