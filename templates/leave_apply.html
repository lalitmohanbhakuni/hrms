{% extends 'base.html' %}

{% block title %}Apply for Leave - HRMS{% endblock %}
{% block page_icon %}plus-circle{% endblock %}
{% block page_title %}Apply for Leave{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="leave_type" class="form-label fw-semibold">Leave Type</label>
                            <select name="leave_type" id="leave_type" class="form-select" required>
                                <option value="">Select...</option>
                                {% for lt in leave_types %}
                                    <option value="{{ lt.id }}">{{ lt.name }} ({{ lt.days_allowed }} days)</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Duration</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="is_half_day" id="is_half_day">
                                <label class="form-check-label" for="is_half_day">Half Day</label>
                            </div>
                            <div id="half_day_session_div" style="display:none;">
                                <select name="half_day_session" class="form-select mt-2">
                                    <option value="First">First Half</option>
                                    <option value="Second">Second Half</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="start_date" class="form-label fw-semibold">From Date</label>
                            <input type="date" name="start_date" id="start_date" class="form-control" required>
                        </div>
                        <div class="col-md-6" id="end_date_div">
                            <label for="end_date" class="form-label fw-semibold">To Date</label>
                            <input type="date" name="end_date" id="end_date" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label for="reason" class="form-label fw-semibold">Reason</label>
                            <textarea name="reason" id="reason" rows="3" class="form-control" required placeholder="Describe your reason..."></textarea>
                        </div>
                        <div class="col-12">
                            <label for="attachment" class="form-label fw-semibold">Attachment (optional)</label>
                            <input type="file" name="attachment" id="attachment" class="form-control">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                <i class="fas fa-paper-plane me-2"></i> Submit Leave Request
                            </button>
                            <a href="{% url 'employee_leaves' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('is_half_day').addEventListener('change', function() {
        const halfDayDiv = document.getElementById('half_day_session_div');
        const endDateDiv = document.getElementById('end_date_div');
        if (this.checked) {
            halfDayDiv.style.display = 'block';
            endDateDiv.style.display = 'none';
            document.getElementById('end_date').removeAttribute('required');
        } else {
            halfDayDiv.style.display = 'none';
            endDateDiv.style.display = 'block';
            document.getElementById('end_date').setAttribute('required', 'required');
        }
    });
</script>
{% endblock %}
