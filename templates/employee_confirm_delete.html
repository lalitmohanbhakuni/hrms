{% extends 'base.html' %}

{% block title %}Delete Employee - HRMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="glass-card border-2 border-red-500 p-6 text-center">
        <div class="mb-4">
            <i class="fas fa-exclamation-triangle text-red-500 text-6xl"></i>
        </div>
        <h3 class="text-2xl font-bold text-red-500">Confirm Delete</h3>
        <p class="text-gray-600 my-4">
            Are you sure you want to delete <strong>{{ employee.username }}</strong>?
            <br>
            <span class="text-red-500 text-sm">This action cannot be undone!</span>
        </p>
        <form method="post">
            {% csrf_token %}
            <div class="flex justify-center space-x-4">
                <a href="{% url 'employee_list' %}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition"><i class="fas fa-trash-alt mr-2"></i> Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
