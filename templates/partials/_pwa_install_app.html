{% load static %}
<style>
.app-pwa-modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 99999; padding: 20px; }
.app-pwa-modal.show { display: flex; }
.app-pwa-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 32px 24px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.7); }
.app-pwa-icon { font-size: 3rem; margin-bottom: 14px; line-height: 1; }
.app-pwa-card h3 { font-size: 1.25rem; color: #fff; margin: 0 0 10px; font-weight: 700; }
.app-pwa-card p { font-size: 0.9rem; color: #94a3b8; margin: 0 0 22px; line-height: 1.5; }
.app-pwa-actions { display: flex; flex-direction: column; gap: 10px; }
.app-pwa-btn { padding: 14px 20px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; }
.app-pwa-btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
.app-pwa-btn-ghost { background: rgba(255,255,255,0.08); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.15); }
</style>

<div id="appInstallModal" class="app-pwa-modal">
  <div class="app-pwa-card">
    <div class="app-pwa-icon">📱</div>
    <h3>Install NitoHR</h3>
    <p>Install the app for faster access — opens without the browser bar and feels like a native app.</p>
    <div class="app-pwa-actions">
      <button id="appInstallYes" class="app-pwa-btn app-pwa-btn-primary">Install</button>
      <button id="appInstallNo" class="app-pwa-btn app-pwa-btn-ghost">Not now</button>
    </div>
  </div>
</div>

<script>
(function () {
  // 1. Skip if already installed (running as PWA)
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) return;

  // 2. Mobile-only check
  var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  var isNarrowTouch = window.innerWidth <= 768 && ('ontouchstart' in window || navigator.maxTouchPoints > 0);
  if (!isMobileUA && !isNarrowTouch) return;

  // 3. Skip if dismissed this session
  if (sessionStorage.getItem('app_install_dismissed') === '1') return;

  var modal = document.getElementById('appInstallModal');
  var yesBtn = document.getElementById('appInstallYes');
  var noBtn = document.getElementById('appInstallNo');
  if (!modal || !yesBtn || !noBtn) return;

  var deferredPrompt = null;
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  // Capture BIP if it fires (but we don't WAIT for it)
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    console.log('✅ BIP captured');
  });

  // ── SHOW POPUP IMMEDIATELY (not waiting for BIP) ──
  setTimeout(function () {
    modal.classList.add('show');
    console.log('📱 Popup shown');
  }, 1500);

  yesBtn.addEventListener('click', async function () {
    if (deferredPrompt) {
      // Native install prompt available
      deferredPrompt.prompt();
      var r = await deferredPrompt.userChoice;
      console.log('Install choice:', r.outcome);
      deferredPrompt = null;
      modal.classList.remove('show');
      return;
    }

    // No BIP — show manual instructions
    if (isIOS) {
      modal.querySelector('.app-pwa-card').innerHTML =
        '<div class="app-pwa-icon">📲</div>' +
        '<h3>Add to Home Screen</h3>' +
        '<p style="text-align:left;">1. Tap the <b>Share</b> button at the bottom<br><br>2. Scroll down → <b>Add to Home Screen</b><br><br>3. Tap <b>Add</b></p>' +
        '<div class="app-pwa-actions"><button id="appGotIt" class="app-pwa-btn app-pwa-btn-primary">Got it</button></div>';
    } else {
      // Android — manual Chrome menu install
      modal.querySelector('.app-pwa-card').innerHTML =
        '<div class="app-pwa-icon">📲</div>' +
        '<h3>Install NitoHR</h3>' +
        '<p style="text-align:left;">1. Tap the <b>⋮ menu</b> (3 dots) in Chrome<br><br>2. Tap <b>"Install app"</b> or <b>"Add to Home screen"</b><br><br>3. Confirm → done!</p>' +
        '<div class="app-pwa-actions"><button id="appGotIt" class="app-pwa-btn app-pwa-btn-primary">Got it</button></div>';
    }

    var g = modal.querySelector('#appGotIt');
    if (g) g.addEventListener('click', function () {
      sessionStorage.setItem('app_install_dismissed', '1');
      modal.classList.remove('show');
    });
  });

  noBtn.addEventListener('click', function () {
    sessionStorage.setItem('app_install_dismissed', '1');
    modal.classList.remove('show');
  });

  window.addEventListener('appinstalled', function () {
    modal.classList.remove('show');
  });
})();
</script>
