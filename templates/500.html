{% extends 'base.html' %}

{% block title %}Server Error - HRMS{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="error-page">
                <h1 class="display-1 fw-bold text-danger">500</h1>
                <h2 class="mb-4">Something Went Wrong</h2>
                <p class="text-muted mb-4">We're sorry, but something went wrong on our end. Please try again later.</p>
                <p class="text-muted small">If this issue persists, please contact support.</p>
                <a href="{% url 'dashboard' %}" class="btn btn-primary rounded-pill px-4">
                    <i class="fas fa-home me-2"></i>Go to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
