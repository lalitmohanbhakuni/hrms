{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
    /* ═══════════════════════════════════════════════════
       Payroll base layout — refined design system
       Prefix: .pbase-
       ═══════════════════════════════════════════════════ */
    .pbase {
        --pbase-surface:       #ffffff;
        --pbase-surface-2:     #fafbfc;
        --pbase-border:        #e8eaee;
        --pbase-border-hover:  #d5d9e0;
        --pbase-text:          #0f172a;
        --pbase-text-muted:    #64748b;
        --pbase-text-faint:    #94a3b8;
        --pbase-primary:       #4f46e5;
        --pbase-primary-soft:  #eef2ff;
        --pbase-pill:          999px;
        --pbase-shadow-xs:     0 1px 2px rgba(15,23,42,.04);
        --pbase-ease:          cubic-bezier(.4, 0, .2, 1);
    }

    /* ─── Breadcrumb ─── */
    .pbase-crumb {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: .8rem;
        color: var(--pbase-text-muted);
        margin-bottom: 12px;
    }
    .pbase-crumb a {
        color: var(--pbase-text-muted);
        text-decoration: none;
        transition: color .15s var(--pbase-ease);
    }
    .pbase-crumb a:hover {
        color: var(--pbase-primary);
    }
    .pbase-crumb-sep {
        color: var(--pbase-text-faint);
        font-size: .7rem;
        user-select: none;
    }
    .pbase-crumb-current {
        color: var(--pbase-text);
        font-weight: 500;
    }

    /* ─── Segmented tabs ─── */
    .pbase-tabs {
        display: inline-flex;
        gap: 2px;
        padding: 4px;
        background: var(--pbase-surface);
        border: 1px solid var(--pbase-border);
        border-radius: 10px;
        list-style: none;
        margin: 0 0 22px;
        box-shadow: var(--pbase-shadow-xs);
        flex-wrap: wrap;
    }
    .pbase-tabs .nav-item { margin: 0; }
    .pbase-tabs .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 16px;
        border-radius: 7px;
        font-size: .82rem;
        font-weight: 500;
        color: var(--pbase-text-muted);
        background: transparent;
        text-decoration: none;
        transition: color .15s var(--pbase-ease), background .15s var(--pbase-ease);
        white-space: nowrap;
    }
    .pbase-tabs .nav-link i {
        font-size: .82rem;
        opacity: .7;
    }
    .pbase-tabs .nav-link:hover { color: var(--pbase-text); }
    .pbase-tabs .nav-link:hover i { opacity: 1; }
    .pbase-tabs .nav-link.active {
        background: var(--pbase-primary);
        color: #fff;
    }
    .pbase-tabs .nav-link.active i { opacity: 1; }

    /* ─── Responsive ─── */
    @media (max-width: 767.98px) {
        .pbase-tabs {
            width: 100%;
            display: flex;
            overflow-x: auto;
            flex-wrap: nowrap;
            scrollbar-width: none;
        }
        .pbase-tabs::-webkit-scrollbar { display: none; }
        .pbase-tabs .nav-item { flex-shrink: 0; }
        .pbase-tabs .nav-link {
            padding: 8px 12px;
            font-size: .76rem;
        }
    }
</style>

<div class="container-fluid pbase">

    <!-- ═══════════ Breadcrumb ═══════════ -->
    <nav class="pbase-crumb" aria-label="breadcrumb">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <span class="pbase-crumb-sep"><i class="fas fa-chevron-right"></i></span>
        <span class="pbase-crumb-current">Payroll</span>
    </nav>

    <!-- ═══════════ Sub-navigation tabs ═══════════ -->
    <ul class="pbase-tabs">
        <li class="nav-item">
            <a class="nav-link {% if request.path == '/payroll/' %}active{% endif %}"
               href="{% url 'payroll_dashboard' %}">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if 'salary' in request.path %}active{% endif %}"
               href="{% url 'employee_salary_list' %}">
                <i class="fas fa-money-bill-wave"></i> Employee Salary
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if 'process' in request.path %}active{% endif %}"
               href="{% url 'payroll_processing' %}">
                <i class="fas fa-cogs"></i> Payroll Processing
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if 'payslips' in request.path %}active{% endif %}"
               href="{% url 'payroll_list' %}">
                <i class="fas fa-file-invoice"></i> Payslips
            </a>
        </li>
    </ul>

    <!-- ═══════════ Main content ═══════════ -->
    {% block payroll_content %}{% endblock %}
</div>

{% endblock %}
